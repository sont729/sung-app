<!-- 바깥에서 아무것도 가져오지 않는다.
     예전에는 구글 서체를 불러 썼다. 그러면 이 페이지를 여는 순간 방문자의
     IP와 브라우저 정보가 구글로 간다 — 바로 그 페이지가 "제3자에게 제공하는

<style>
:root { --page:#FBF8F0; --ink:#201D17; --dim:rgba(32,29,23,.72);

@media (prefers-color-scheme: dark) {
  :root { --page:#12100C; --ink:#E4DECE; --dim:rgba(228,222,206,.71);
    --ghost:rgba(228,222,206,.34); --gold:#B08B4C; --hair:rgba(228,222,206,.14); }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink);
  font-family:'Apple SD Gothic Neo','Noto Serif KR','Nanum Myeongjo',serif;
  line-height:1.85; }
main { max-width:39rem; margin:0 auto; padding:56px clamp(16px,4vw,28px) 96px; }
h1 { font-size:26px; letter-spacing:.06em; margin:0 0 6px; }
.sub { color:var(--ghost); font-size:13px; margin:0 0 40px;
  font-family:-apple-system,'Apple SD Gothic Neo',sans-serif; }
h2 { font-size:17px; color:var(--gold); margin:40px 0 10px; }
p, li { font-size:15.5px; color:var(--dim); word-break:keep-all; }
strong { color:var(--ink); font-weight:700; }
ul { padding-left:20px; }
a { color:var(--gold); }
.nav { border-top:1px solid var(--hair); margin-top:56px; padding-top:16px;
  font-size:13px; font-family:-apple-system,'Apple SD Gothic Neo',sans-serif; }
.nav a { margin-right:16px; text-decoration:none; }
</style>

<p class="sub">히브리어에서 직접 옮긴 창세기 · 원문과 이야기</p>
<p>창세기 한 권을 담은 읽기 앱입니다. 쉰 장, 1,533절 전부 —
히브리어 원문, 원문에서 직접 옮긴 한국어 번역, 그리고 장면마다 붙인 이야기로 읽습니다.</p>
<p>인터넷 연결도, 계정도, 광고도 없습니다. 읽은 자리와 남긴 메모는 전부 기기 안에만 있습니다.</p>
